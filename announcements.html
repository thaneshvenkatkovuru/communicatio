<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Announcements Panel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
      padding:30px;
      color:white;
    }

    .panel{
      width:100%;
      max-width:850px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(12px);
      border:1px solid rgba(255,255,255,0.12);
      border-radius:24px;
      padding:30px;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
      flex-wrap:wrap;
      gap:15px;
    }

    .header h1{
      font-size:32px;
      font-weight:700;
      letter-spacing:1px;
    }

    .badge{
      background:#22c55e;
      color:white;
      padding:8px 16px;
      border-radius:50px;
      font-size:14px;
      font-weight:600;
      box-shadow:0 0 15px rgba(34,197,94,0.5);
    }

    .announcement-list{
      display:flex;
      flex-direction:column;
      gap:18px;
    }

    .card{
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.08);
      border-radius:18px;
      padding:20px;
      transition:0.3s ease;
      position:relative;
      overflow:hidden;
    }

    .card:hover{
      transform:translateY(-5px);
      background:rgba(255,255,255,0.1);
      box-shadow:0 10px 25px rgba(0,0,0,0.3);
    }

    .card::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      width:6px;
      height:100%;
      background:linear-gradient(to bottom,#38bdf8,#8b5cf6);
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
      flex-wrap:wrap;
      gap:10px;
    }

    .title{
      font-size:20px;
      font-weight:600;
    }

    .date{
      font-size:13px;
      color:#cbd5e1;
    }

    .message{
      font-size:15px;
      line-height:1.7;
      color:#e2e8f0;
    }

    .tag{
      display:inline-block;
      margin-top:15px;
      padding:6px 14px;
      border-radius:50px;
      font-size:12px;
      font-weight:600;
      background:rgba(59,130,246,0.2);
      color:#93c5fd;
      border:1px solid rgba(147,197,253,0.3);
    }

    @media(max-width:700px){
      .header h1{
        font-size:24px;
      }

      .title{
        font-size:17px;
      }

      .panel{
        padding:20px;
      }
    }
  </style>
</head>
<body>

  <div class="panel">

    <div class="header">
      <h1>📢 Announcements Panel</h1>
      <div class="badge">Live Updates</div>
    </div>

    <div class="announcement-list">

      <div class="card">
        <div class="top">
          <div class="title">Msg-1</div>
          <div class="date">09 May 2026</div>
        </div>

        <div class="message">
          write here...........
        </div>

        <div class="tag">Important</div>
      </div>

      <div class="card">
        <div class="top">
          <div class="title">Msg-2</div>
          <div class="date">08 May 2026</div>
        </div>

        <div class="message">
         Write Here........
        </div>

        <div class="tag">Placement</div>
      </div>

      <div class="card">
        <div class="top">
          <div class="title">Msg-3</div>
          <div class="date">07 May 2026</div>
        </div>

        <div class="message">
          write here........
        </div>

        <div class="tag">Notice</div>
      </div>

    </div>

  </div>

</body>
</html>
