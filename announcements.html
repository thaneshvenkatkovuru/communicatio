<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modern Announcements Panel</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      min-height:100vh;
      background:
      radial-gradient(circle at top left,#2563eb22,transparent 30%),
      radial-gradient(circle at bottom right,#7c3aed22,transparent 30%),
      #f3f6fb;
      padding:40px 20px;
      overflow-x:hidden;
    }

    .panel{
      width:100%;
      max-width:1050px;
      margin:auto;
      background:rgba(255,255,255,0.75);
      backdrop-filter:blur(16px);
      border:1px solid rgba(255,255,255,0.4);
      border-radius:28px;
      padding:35px;
      box-shadow:
      0 15px 40px rgba(0,0,0,0.08),
      inset 0 1px 0 rgba(255,255,255,0.7);
      position:relative;
      overflow:hidden;
    }

    .panel::before{
      content:'';
      position:absolute;
      width:300px;
      height:300px;
      background:linear-gradient(135deg,#2563eb22,#7c3aed22);
      border-radius:50%;
      top:-120px;
      right:-100px;
    }

    .header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:15px;
      margin-bottom:35px;
      position:relative;
      z-index:2;
    }

    .header h1{
      font-size:38px;
      font-weight:700;
      color:#111827;
      letter-spacing:0.5px;
    }

    .header h1 span{
      color:#2563eb;
    }

    .badge{
      background:linear-gradient(135deg,#2563eb,#7c3aed);
      color:white;
      padding:11px 20px;
      border-radius:50px;
      font-size:14px;
      font-weight:600;
      box-shadow:0 10px 20px rgba(37,99,235,0.25);
      animation:pulse 2s infinite;
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
      }
      50%{
        transform:scale(1.05);
      }
      100%{
        transform:scale(1);
      }
    }

    .announcement-list{
      display:flex;
      flex-direction:column;
      gap:24px;
      position:relative;
      z-index:2;
    }

    .card{
      position:relative;
      background:white;
      border-radius:22px;
      padding:25px;
      overflow:hidden;
      transition:0.35s ease;
      border:1px solid #e5e7eb;
      box-shadow:0 8px 24px rgba(0,0,0,0.05);
    }

    .card:hover{
      transform:translateY(-6px);
      box-shadow:0 15px 35px rgba(0,0,0,0.12);
    }

    .card::before{
      content:'';
      position:absolute;
      top:0;
      left:0;
      width:8px;
      height:100%;
      background:linear-gradient(to bottom,#2563eb,#7c3aed);
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:12px;
      margin-bottom:15px;
    }

    .title{
      font-size:23px;
      font-weight:600;
      color:#111827;
    }

    .date{
      background:#eef2ff;
      color:#4b5563;
      padding:7px 14px;
      border-radius:50px;
      font-size:13px;
      font-weight:500;
    }

    .message{
      font-size:15px;
      line-height:1.9;
      color:#4b5563;
      margin-bottom:18px;
    }

    .bottom{
      display:flex;
      justify-content:flex-start;
      align-items:center;
      flex-wrap:wrap;
      gap:12px;
    }

    .tag{
      padding:8px 16px;
      border-radius:50px;
      font-size:12px;
      font-weight:600;
      letter-spacing:0.5px;
    }

    .important{
      background:#fee2e2;
      color:#dc2626;
    }

    .placement{
      background:#dcfce7;
      color:#16a34a;
    }

    .notice{
      background:#dbeafe;
      color:#2563eb;
    }

    @media(max-width:768px){

      body{
        padding:20px;
      }

      .panel{
        padding:24px;
      }

      .header h1{
        font-size:28px;
      }

      .title{
        font-size:19px;
      }

      .message{
        font-size:14px;
      }

    }

  </style>
</head>

<body>

  <div class="panel">

    <div class="header">
      <h1>📢 <span>Announcements</span> Panel</h1>
      <div class="badge">● Live Updates</div>
    </div>

    <div class="announcement-list">

      <!-- CARD 1 -->
      <div class="card">

        <div class="top">
          <div class="title">MSG - 1</div>
          <div class="date">09 May 2026</div>
        </div>

        <div class="message">
        Enter your msg Here.....!
        </div>

        <div class="bottom">
          <div class="tag important">Important</div>
        </div>

      </div>

      <!-- CARD 2 -->
      <div class="card">

        <div class="top">
          <div class="title">Msg - 2</div>
          <div class="date">08 May 2026</div>
        </div>

        <div class="message">
          Enter your msg Here.....!
        </div>

        <div class="bottom">
          <div class="tag placement">Placement</div>
        </div>

      </div>

      <!-- CARD 3 -->
      <div class="card">

        <div class="top">
          <div class="title">Msg - 3</div>
          <div class="date">07 May 2026</div>
        </div>

        <div class="message">
          Enter your msg Here.....!
        </div>

        <div class="bottom">
          <div class="tag notice">Notice</div>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
