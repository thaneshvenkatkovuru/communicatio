<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
}

.logout-box{
    background:rgba(255,255,255,0.08);
    padding:40px;
    border-radius:20px;
    text-align:center;
    color:white;
    width:350px;
    backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}
        .logout-box h1{
            margin-bottom:15px;
            font-size:28px;
        }

        .logout-box p{
            margin-bottom:25px;
            color:#d1d5db;
        }

        .btn{
            display:inline-block;
            padding:12px 25px;
            border:none;
            border-radius:10px;
            text-decoration:none;
            font-weight:bold;
            transition:0.3s;
            margin:5px;
        }

        .logout-btn{
            background:#ef4444;
            color:white;
        }

        .logout-btn:hover{
            background:#dc2626;
        }

        .cancel-btn{
            background:#3b82f6;
            color:white;
        }

        .cancel-btn:hover{
            background:#2563eb;
        }
    </style>
</head>
<body>

    <div class="logout-box">
        <h1>Logout</h1>

        <p>Are you sure you want to logout from your account?</p>

        <!-- Changed here -->
        <a href="Index.html" class="btn logout-btn">Yes, Logout</a>

        <a href="dashboard.html" class="btn cancel-btn">Cancel</a>
    </div>

</body>
</html>
